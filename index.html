<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProductHub | Gestión de Productos</title>


  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="css/styles.css" />
</head>


<body>
  <!-- Top bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <span class="brand-dot"></span> ProductHub
      </a>
      <span class="navbar-text text-secondary small">
        Sprint 1 · Listado dinámico + Agregar + Validación
      </span>
    </div>
  </nav>


  <main class="container my-4">
    <div class="row g-4">
      <!-- Form -->
      <div class="col-12 col-lg-4">
        <div class="card shadow-sm card-soft">
          <div class="card-body">
            <h5 class="card-title mb-1">Nuevo producto</h5>
            <p class="text-secondary small mb-3">Agrega un producto al inventario.</p>


            <form id="productForm">
              <div class="mb-2">
                <label class="form-label">Nombre</label>
                <input id="name" class="form-control" placeholder="Ej: Mouse gamer" />
                <div id="nameHelp" class="invalid-feedback"></div>
              </div>


              <div class="mb-2">
                <label class="form-label">Categoría</label>
                <input id="category" class="form-control" placeholder="Ej: Electrónica" />
                <div id="categoryHelp" class="invalid-feedback"></div>
              </div>


              <div class="row g-2">
                <div class="col-6">
                  <div class="mb-2">
                    <label class="form-label">Precio ($)</label>
                    <input id="price" class="form-control" placeholder="Ej: 19.99" />
                    <div id="priceHelp" class="invalid-feedback"></div>
                  </div>
                </div>
                <div class="col-6">
                  <div class="mb-2">
                    <label class="form-label">Stock</label>
                    <input id="stock" class="form-control" placeholder="Ej: 10" />
                    <div id="stockHelp" class="invalid-feedback"></div>
                  </div>
                </div>
              </div>


              <div class="mb-3">
                <label class="form-label">Imagen (URL opcional)</label>
                <input id="imageUrl" class="form-control" placeholder="https://..." />
                <div id="imageUrlHelp" class="invalid-feedback"></div>
              </div>


              <button class="btn btn-primary w-100" type="submit">
                Agregar producto
              </button>
            </form>
          </div>
        </div>
      </div>


      <!-- List -->
      <div class="col-12 col-lg-8">
        <div class="d-flex align-items-center justify-content-between mb-3 gap-2">
  <div>
    <h4 class="mb-0">Inventario</h4>
    <div id="countLabel" class="text-secondary small">0 productos</div>
  </div>


  <div class="search-wrap">
    <input id="searchInput" class="form-control" placeholder="Buscar por nombre o categoría..." />
  </div>
</div>


        <div id="emptyState" class="card shadow-sm card-soft d-none">
          <div class="card-body py-5 text-center">
            <div class="display-6">📦</div>
            <h5 class="mt-2 mb-1">No hay productos todavía</h5>
            <p class="text-secondary mb-0">Agrega tu primer producto para verlo aquí.</p>
          </div>
        </div>


        <div id="productGrid" class="row g-3"></div>
      </div>
    </div>
  </main>


  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <strong class="me-auto">ProductHub</strong>
        <small class="text-secondary">ahora</small>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
      <div id="toastBody" class="toast-body">Mensaje</div>
    </div>
  </div>


  <script src="js/products.data.js"></script>
  <script src="js/products.validation.js"></script>
  <script src="js/products.render.js"></script>
  <script src="js/products.add.js"></script>
  <script src="js/main.js"></script>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
